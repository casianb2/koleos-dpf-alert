plugins {
    id 'java'
    id 'application'
}

group = 'com.koleos.osm'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.openstreetmap.osmosis:osmosis-core:0.48.3'
    implementation 'org.openstreetmap.osmosis:osmosis-pbf:0.48.3'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'org.mapdb:mapdb:3.0.10'
}

application {
    mainClass = 'com.koleos.osm.OSMPreprocessor'
}

jar {
    archiveFileName = 'OSMPreprocessor.jar'

    manifest {
        attributes(
            'Main-Class': 'com.koleos.osm.OSMPreprocessor'
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
